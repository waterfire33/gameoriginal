<!DOCTYPE html>
<html>
<head>
    <title>TPR Vocabulary Game - Player</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TPR Vocabulary Game - Learn vocabulary with images and challenges!">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: white;
        }
        
        /* Join Screen */
        #joinScreen {
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            margin: 50px auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            color: #333;
        }
        #joinScreen h1 {
            margin-bottom: 20px;
            color: #667eea;
        }
        #joinScreen input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
        }
        #joinScreen input:focus {
            outline: none;
            border-color: #667eea;
        }
        #joinScreen button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        #joinScreen button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        /* Game Area */
        #gameArea {
            display: none;
            max-width: 600px;
            margin: 0 auto;
        }
        
        /* Game Container */
        .game-container {
            background: rgba(255,255,255,0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            color: #333;
            margin-top: 20px;
        }
        
        /* Score Display */
        #scoreBoard {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #667eea;
        }
        
        /* Progress Display */
        #progressDisplay {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        
        /* Timer Bar */
        #timerBar {
            width: 100%;
            height: 12px;
            background: #e0e0e0;
            border-radius: 6px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        #timerFill {
            height: 100%;
            background: linear-gradient(90deg, #4caf50, #8bc34a);
            width: 100%;
            transition: width 0.1s linear;
            border-radius: 6px;
        }
        #timerFill.warning {
            background: linear-gradient(90deg, #ff9800, #ffc107);
        }
        #timerFill.danger {
            background: linear-gradient(90deg, #f44336, #ff5722);
        }
        
        /* Image Display */
        #imageArea {
            margin-bottom: 20px;
        }
        #tprImage {
            max-width: 100%;
            max-height: 250px;
            object-fit: contain;
            border: 3px solid #667eea;
            border-radius: 10px;
            background: white;
        }
        
        /* Input Area (Main Loop) */
        #inputArea {
            display: none;
        }
        #userInput {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 10px;
        }
        #userInput:focus {
            outline: none;
            border-color: #667eea;
        }
        #submitBtn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #4caf50 0%, #8bc34a 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #submitBtn:hover {
            transform: translateY(-2px);
        }
        
        /* Options Area (Second/Third Loop) */
        #optionsArea {
            display: none;
        }
        .option-btn {
            width: 100%;
            padding: 15px;
            margin: 8px 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .option-btn:hover {
            transform: translateY(-2px);
        }
        .option-btn.correct {
            background: linear-gradient(135deg, #4caf50 0%, #8bc34a 100%);
        }
        .option-btn.incorrect {
            background: linear-gradient(135deg, #f44336 0%, #ff5722 100%);
        }
        .option-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Feedback Message */
        #feedbackMsg {
            font-weight: bold;
            margin-top: 15px;
            min-height: 24px;
            font-size: 18px;
        }
        #feedbackMsg.correct {
            color: #4caf50;
        }
        #feedbackMsg.incorrect {
            color: #f44336;
        }
        #feedbackMsg.info {
            color: #667eea;
        }
        
        /* Waiting Room */
        #waitingRoom {
            display: none;
        }
        #waitingRoom h3 {
            color: #667eea;
            margin-bottom: 15px;
        }
        
        /* Finished Screen */
        #finishedScreen {
            display: none;
        }
        #finishedScreen h2 {
            color: #4caf50;
            font-size: 28px;
        }
        #finalScore {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }
        
        /* Game Over Screen */
        #gameOverScreen {
            display: none;
        }
        #gameOverScreen h2 {
            color: #667eea;
            font-size: 28px;
        }
        .winner-name {
            font-size: 36px;
            color: #4caf50;
            font-weight: bold;
            margin: 20px 0;
        }
        .final-scores {
            text-align: left;
            max-width: 300px;
            margin: 0 auto;
        }
        .score-row {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .score-row.you {
            background: #e8f5e9;
            font-weight: bold;
        }
        
        /* Reconnect Banner */
        #reconnectBanner {
            display: none;
            background: #ff9800;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        #reconnectBanner button {
            background: white;
            color: #ff9800;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        
        /* Header with player name */
        .player-header {
            margin-bottom: 10px;
        }
        .player-header h2 {
            margin: 0;
            font-size: 20px;
        }
        
        /* Sound Toggle */
        .sound-toggle {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 20px;
            cursor: pointer;
            z-index: 1000;
        }
        .sound-toggle.muted {
            opacity: 0.5;
        }
        
        /* Audio Unlock Banner */
        #audioUnlockBanner {
            display: none;
            background: linear-gradient(135deg, #4caf50 0%, #8bc34a 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
            cursor: pointer;
            animation: pulse 2s infinite;
        }
        #audioUnlockBanner:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <!-- Join Screen -->
    <div id="joinScreen">
        <h1>📚 TPR Vocabulary</h1>
        <input type="text" id="roomCode" placeholder="Room Code" maxlength="4" style="text-transform: uppercase;">
        <input type="text" id="playerName" placeholder="Your Name" maxlength="20">
        <button onclick="joinGame()">Join Game</button>
        <p id="joinError" style="color: #f44336; margin-top: 10px;"></p>
    </div>

    <!-- Sound Toggle Button -->
    <button class="sound-toggle" id="soundToggle" onclick="toggleSound()" title="Toggle Sound">🔊</button>
    
    <!-- Game Area -->
    <div id="gameArea">
        <div class="player-header">
            <h2>👋 <span id="displayName"></span></h2>
        </div>
        
        <!-- Reconnect Banner -->
        <div id="reconnectBanner">
            <p style="margin: 0 0 10px 0;">Connection lost!</p>
            <button onclick="attemptReconnect()">Reconnect</button>
        </div>
        
        <!-- Audio Unlock Banner (for iOS) -->
        <div id="audioUnlockBanner" onclick="unlockAudio()">
            🔊 Tap here to enable sound!
        </div>
        
        <!-- Waiting Room -->
        <div id="waitingRoom" class="game-container">
            <h3 id="waitingHeader">Waiting for the host to start...</h3>
            <p id="waitingText">Get ready to learn some vocabulary! 🎯</p>
            <div id="playerCount" style="margin-top: 15px; color: #666;"></div>
        </div>
        
        <!-- Main Game Screen -->
        <div id="gameScreen" class="game-container" style="display: none;">
            <div id="scoreBoard">Score: <span id="scoreVal">0</span></div>
            <div id="progressDisplay">Word <span id="wordIndex">1</span> of <span id="totalWords">10</span></div>
            
            <div id="timerBar">
                <div id="timerFill"></div>
            </div>
            
            <div id="imageArea">
                <img id="tprImage" src="" alt="Vocabulary Image">
            </div>
            
            <!-- Text Input (Main Loop) -->
            <div id="inputArea">
                <input type="text" id="userInput" placeholder="Type the word..." autocomplete="off">
                <button id="submitBtn" onclick="submitTypedAnswer()">Submit</button>
            </div>
            
            <!-- Multiple Choice Options (Second/Third Loop) -->
            <div id="optionsArea"></div>
            
            <div id="feedbackMsg"></div>
        </div>
        
        <!-- Player Finished Screen -->
        <div id="finishedScreen" class="game-container">
            <h2>🎉 You Finished!</h2>
            <div id="finalScore">0</div>
            <p>points</p>
            <p style="color: #666; margin-top: 20px;">Waiting for other players...</p>
        </div>
        
        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="game-container">
            <h2>🏆 Game Over!</h2>
            <div id="winnerDisplay"></div>
            <div id="allScores" class="final-scores"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let roomCode = null;
        let playerId = null;
        let currentScore = 0;
        let timerInterval = null;
        let timerDuration = 11000; // 11 seconds default
        let inputLocked = false;
        
        // Audio state
        let soundEnabled = true;
        let audioUnlocked = false;
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        
        const STORAGE_KEY = 'tprPlayerInfo';
        
        // =====================================================================
        // DOM Elements
        // =====================================================================
        const joinScreen = document.getElementById('joinScreen');
        const gameArea = document.getElementById('gameArea');
        const waitingRoom = document.getElementById('waitingRoom');
        const gameScreen = document.getElementById('gameScreen');
        const finishedScreen = document.getElementById('finishedScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const reconnectBanner = document.getElementById('reconnectBanner');
        
        const scoreVal = document.getElementById('scoreVal');
        const wordIndex = document.getElementById('wordIndex');
        const totalWords = document.getElementById('totalWords');
        const timerFill = document.getElementById('timerFill');
        const tprImage = document.getElementById('tprImage');
        const inputArea = document.getElementById('inputArea');
        const optionsArea = document.getElementById('optionsArea');
        const userInput = document.getElementById('userInput');
        const feedbackMsg = document.getElementById('feedbackMsg');
        
        // =====================================================================
        // Initialization
        // =====================================================================
        
        // Get room code from URL if present
        const urlParams = new URLSearchParams(window.location.search);
        const urlRoomCode = urlParams.get('room');
        if (urlRoomCode) {
            document.getElementById('roomCode').value = urlRoomCode.toUpperCase();
        }
        
        // Pre-fill from local storage
        try {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored && !urlRoomCode) {
                const parsed = JSON.parse(stored);
                if (parsed.roomCode) {
                    document.getElementById('roomCode').value = parsed.roomCode;
                }
                if (parsed.playerName) {
                    document.getElementById('playerName').value = parsed.playerName;
                }
            }
        } catch (e) {}
        
        // =====================================================================
        // Join Game
        // =====================================================================
        
        function joinGame() {
            roomCode = document.getElementById('roomCode').value.toUpperCase();
            const playerName = document.getElementById('playerName').value.trim();
            
            if (!roomCode || !playerName) {
                document.getElementById('joinError').textContent = 'Please enter both room code and name';
                return;
            }
            
            // Try to unlock audio on this user gesture (important for iOS)
            if ('speechSynthesis' in window && !audioUnlocked) {
                const utterance = new SpeechSynthesisUtterance('');
                utterance.volume = 0;
                speechSynthesis.speak(utterance);
                audioUnlocked = true;
            }
            
            // Store for reconnection
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ roomCode, playerName }));
            } catch (e) {}
            
            socket.emit('join-game', { roomCode, playerName });
        }
        
        // Enter key to join
        document.getElementById('roomCode').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('playerName').focus();
        });
        document.getElementById('playerName').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinGame();
        });
        
        // =====================================================================
        // Socket Event Handlers
        // =====================================================================
        
        socket.on('joined-game', (data) => {
            playerId = data.playerId;
            reconnectBanner.style.display = 'none';
            
            joinScreen.style.display = 'none';
            gameArea.style.display = 'block';
            document.getElementById('displayName').textContent = document.getElementById('playerName').value;
            
            // Check if we need to show audio unlock (iOS)
            checkAudioUnlock();
            
            updateGameState(data.gameState);
        });
        
        socket.on('error', (data) => {
            document.getElementById('joinError').textContent = data.message;
            
            if (data.message === 'Game not found' || data.message === 'Game is full') {
                localStorage.removeItem(STORAGE_KEY);
                const url = new URL(window.location);
                if (url.searchParams.has('room')) {
                    url.searchParams.delete('room');
                    window.history.replaceState({}, document.title, url);
                }
            }
        });
        
        socket.on('disconnect', () => {
            if (gameArea.style.display === 'block') {
                reconnectBanner.style.display = 'block';
            }
        });
        
        socket.on('connect', () => {
            reconnectBanner.style.display = 'none';
            
            if (roomCode && document.getElementById('playerName').value) {
                socket.emit('join-game', {
                    roomCode,
                    playerName: document.getElementById('playerName').value
                });
            }
        });
        
        socket.on('player-joined', (data) => {
            updateGameState(data.gameState);
        });
        
        // =====================================================================
        // Game Started
        // =====================================================================
        
        socket.on('game-started', (data) => {
            timerDuration = data.maxTime || 11000;
            totalWords.textContent = data.vocabularyCount;
            
            waitingRoom.style.display = 'none';
            gameScreen.style.display = 'block';
        });
        
        // =====================================================================
        // Timer
        // =====================================================================
        
        socket.on('timer-start', (data) => {
            startTimerDisplay(data.duration);
        });
        
        function startTimerDisplay(duration) {
            clearInterval(timerInterval);
            
            const durationMs = duration;
            let startTime = Date.now();
            
            timerFill.style.width = '100%';
            timerFill.className = '';
            
            timerInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const remaining = Math.max(0, durationMs - elapsed);
                const pct = (remaining / durationMs) * 100;
                
                timerFill.style.width = pct + '%';
                
                // Color changes
                if (pct < 20) {
                    timerFill.className = 'danger';
                } else if (pct < 40) {
                    timerFill.className = 'warning';
                } else {
                    timerFill.className = '';
                }
                
                if (remaining <= 0) {
                    clearInterval(timerInterval);
                }
            }, 50);
        }
        
        function stopTimer() {
            clearInterval(timerInterval);
        }
        
        // =====================================================================
        // Main Loop (Type the Word)
        // =====================================================================
        
        socket.on('main-loop-start', (data) => {
            inputLocked = false;
            
            // Update progress
            wordIndex.textContent = data.wordIndex;
            totalWords.textContent = data.totalWords;
            
            // Show image
            tprImage.src = data.image;
            
            // Show input, hide options
            inputArea.style.display = 'block';
            optionsArea.style.display = 'none';
            
            // Clear and focus input
            userInput.value = '';
            userInput.disabled = false;
            userInput.focus();
            
            feedbackMsg.textContent = '';
            feedbackMsg.className = '';
        });
        
        function submitTypedAnswer() {
            if (inputLocked) return;
            
            const answer = userInput.value.trim();
            if (!answer) return;
            
            inputLocked = true;
            userInput.disabled = true;
            
            socket.emit('submit-answer', {
                roomCode,
                playerId,
                answer
            });
        }
        
        // Enter key to submit
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') submitTypedAnswer();
        });
        
        // =====================================================================
        // Second Loop (4 Multiple Choice)
        // =====================================================================
        
        socket.on('second-loop-start', (data) => {
            inputLocked = false;
            
            // Show image
            tprImage.src = data.image;
            
            // Hide input, show options
            inputArea.style.display = 'none';
            optionsArea.style.display = 'block';
            
            // Create option buttons
            let html = '';
            data.options.forEach((opt) => {
                html += `<button class="option-btn" onclick="submitChoice('${opt.id}')" data-id="${opt.id}">${opt.index}. ${opt.word}</button>`;
            });
            optionsArea.innerHTML = html;
            
            feedbackMsg.textContent = data.message;
            feedbackMsg.className = 'info';
        });
        
        // =====================================================================
        // Third Loop (2 Binary Choice)
        // =====================================================================
        
        socket.on('third-loop-start', (data) => {
            inputLocked = false;
            
            // Show image
            tprImage.src = data.image;
            
            // Hide input, show options
            inputArea.style.display = 'none';
            optionsArea.style.display = 'block';
            
            // Create option buttons
            let html = '';
            data.options.forEach((opt) => {
                html += `<button class="option-btn" onclick="submitChoice('${opt.id}')" data-id="${opt.id}">${opt.index}. ${opt.word}</button>`;
            });
            optionsArea.innerHTML = html;
            
            feedbackMsg.textContent = data.message;
            feedbackMsg.className = 'info';
        });
        
        function submitChoice(selectedId) {
            if (inputLocked) return;
            
            inputLocked = true;
            
            // Disable all buttons
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.disabled = true;
            });
            
            socket.emit('submit-choice', {
                roomCode,
                playerId,
                selectedId
            });
        }
        
        // =====================================================================
        // Answer Results / Feedback
        // =====================================================================
        
        socket.on('answer-result', (data) => {
            stopTimer();
            
            if (data.correct) {
                currentScore = currentScore + data.points;
                scoreVal.textContent = currentScore;
                
                feedbackMsg.textContent = `${data.message} +${data.points} pts`;
                feedbackMsg.className = 'correct';
                
                // Play pronunciation using browser TTS
                if (data.word) {
                    playAudio(data.word);
                }
                
                // Highlight correct button if in options mode
                if (optionsArea.style.display === 'block') {
                    // All buttons should be neutral/green for correct
                }
            } else {
                feedbackMsg.textContent = data.message;
                feedbackMsg.className = 'incorrect';
                
                // Highlight the wrong selection
                if (data.selectedId) {
                    const wrongBtn = document.querySelector(`.option-btn[data-id="${data.selectedId}"]`);
                    if (wrongBtn) {
                        wrongBtn.classList.add('incorrect');
                    }
                }
            }
        });
        
        socket.on('timeout', (data) => {
            stopTimer();
            feedbackMsg.textContent = data.message;
            feedbackMsg.className = 'incorrect';
        });
        
        socket.on('word-skipped', (data) => {
            feedbackMsg.textContent = data.message;
            feedbackMsg.className = 'info';
        });
        
        // =====================================================================
        // Audio Pronunciation (iOS Compatible)
        // =====================================================================
        
        function playAudio(text) {
            if (!soundEnabled || !audioUnlocked) return;
            
            if ('speechSynthesis' in window) {
                // Cancel any ongoing speech
                speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                utterance.volume = 1.0;
                
                // iOS fix: need to use getVoices
                const voices = speechSynthesis.getVoices();
                const englishVoice = voices.find(v => v.lang.startsWith('en'));
                if (englishVoice) {
                    utterance.voice = englishVoice;
                }
                
                speechSynthesis.speak(utterance);
            }
        }
        
        // Unlock audio on iOS (must be called from user gesture)
        function unlockAudio() {
            if ('speechSynthesis' in window) {
                // Speak a silent/short utterance to unlock
                const utterance = new SpeechSynthesisUtterance('');
                utterance.volume = 0;
                speechSynthesis.speak(utterance);
                
                // Also try speaking a real word quietly
                setTimeout(() => {
                    const testUtterance = new SpeechSynthesisUtterance('Ready');
                    testUtterance.volume = 0.3;
                    testUtterance.rate = 1.5;
                    testUtterance.lang = 'en-US';
                    speechSynthesis.speak(testUtterance);
                }, 100);
            }
            
            audioUnlocked = true;
            document.getElementById('audioUnlockBanner').style.display = 'none';
            document.getElementById('soundToggle').classList.remove('muted');
            
            // Save preference
            try {
                localStorage.setItem('audioUnlocked', 'true');
            } catch(e) {}
        }
        
        // Toggle sound on/off
        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundToggle');
            
            if (soundEnabled) {
                btn.textContent = '🔊';
                btn.classList.remove('muted');
                // If not unlocked yet on iOS, show the banner
                if (!audioUnlocked && isIOS) {
                    document.getElementById('audioUnlockBanner').style.display = 'block';
                }
            } else {
                btn.textContent = '🔇';
                btn.classList.add('muted');
            }
            
            // Save preference
            try {
                localStorage.setItem('soundEnabled', soundEnabled ? 'true' : 'false');
            } catch(e) {}
        }
        
        // Check if we need to show audio unlock banner (iOS)
        function checkAudioUnlock() {
            // Load saved preferences
            try {
                const savedSound = localStorage.getItem('soundEnabled');
                if (savedSound === 'false') {
                    soundEnabled = false;
                    document.getElementById('soundToggle').textContent = '🔇';
                    document.getElementById('soundToggle').classList.add('muted');
                }
                
                const savedUnlock = localStorage.getItem('audioUnlocked');
                if (savedUnlock === 'true') {
                    audioUnlocked = true;
                }
            } catch(e) {}
            
            // Show unlock banner on iOS if not already unlocked
            if (isIOS && !audioUnlocked && soundEnabled) {
                document.getElementById('audioUnlockBanner').style.display = 'block';
            }
            
            // Pre-load voices (needed for iOS)
            if ('speechSynthesis' in window) {
                speechSynthesis.getVoices();
                // iOS needs this event listener
                speechSynthesis.onvoiceschanged = () => {
                    speechSynthesis.getVoices();
                };
            }
        }
        
        // =====================================================================
        // Player Finished
        // =====================================================================
        
        socket.on('player-finished', (data) => {
            stopTimer();
            
            gameScreen.style.display = 'none';
            finishedScreen.style.display = 'block';
            
            document.getElementById('finalScore').textContent = data.score;
        });
        
        // =====================================================================
        // Game Over
        // =====================================================================
        
        socket.on('game-over', (data) => {
            stopTimer();
            
            gameScreen.style.display = 'none';
            finishedScreen.style.display = 'none';
            gameOverScreen.style.display = 'block';
            
            // Show winner
            const winnerDisplay = document.getElementById('winnerDisplay');
            if (data.winner) {
                const isMe = data.winner.id === playerId;
                winnerDisplay.innerHTML = `
                    <p style="color: #666;">Winner</p>
                    <div class="winner-name">${isMe ? '🎉 YOU! 🎉' : data.winner.name}</div>
                    <p style="color: #667eea; font-size: 24px;">${data.winner.score} points</p>
                `;
            }
            
            // Show all scores
            const allScores = document.getElementById('allScores');
            let scoresHtml = '<h4 style="margin: 20px 0 10px 0; color: #666;">Final Standings</h4>';
            data.finalScores.forEach((player, idx) => {
                const isMe = player.id === playerId;
                const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '';
                scoresHtml += `
                    <div class="score-row ${isMe ? 'you' : ''}">
                        <span>${medal} ${player.name}</span>
                        <span>${player.score} pts</span>
                    </div>
                `;
            });
            allScores.innerHTML = scoresHtml;
        });
        
        // =====================================================================
        // Progress Updates (for display)
        // =====================================================================
        
        socket.on('progress-update', (data) => {
            // Could show other players' progress if needed
            // For now, we just use our own state
        });
        
        // =====================================================================
        // Reconnection
        // =====================================================================
        
        function attemptReconnect() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (!stored) {
                    document.getElementById('joinError').textContent = 'No saved connection info.';
                    return;
                }
                const parsed = JSON.parse(stored);
                if (!parsed.roomCode || !parsed.playerName) {
                    document.getElementById('joinError').textContent = 'Saved info incomplete.';
                    return;
                }
                
                roomCode = parsed.roomCode.toUpperCase();
                document.getElementById('roomCode').value = roomCode;
                document.getElementById('playerName').value = parsed.playerName;
                
                socket.emit('join-game', {
                    roomCode,
                    playerName: parsed.playerName
                });
            } catch (e) {
                document.getElementById('joinError').textContent = 'Could not reconnect.';
            }
        }
        
        // =====================================================================
        // Update Game State
        // =====================================================================
        
        function updateGameState(state) {
            if (state.state === 'waiting') {
                waitingRoom.style.display = 'block';
                gameScreen.style.display = 'none';
                finishedScreen.style.display = 'none';
                gameOverScreen.style.display = 'none';
                
                document.getElementById('playerCount').textContent = `${state.players.length} player(s) joined`;
            } else if (state.state === 'playing') {
                waitingRoom.style.display = 'none';
                gameScreen.style.display = 'block';
            } else if (state.state === 'results' || state.state === 'finished') {
                // Game over state handled by game-over event
            }
        }
    </script>
</body>
</html>
